<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Registration & Onboarding Flow</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Custom scrollbar and smooth UI styles */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-black text-white flex justify-center items-center min-h-screen p-0 sm:p-4">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Icons ---
    const IconArrowLeft = () => (
      <svg className="w-6 h-6 text-white cursor-pointer" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M15 19l-7-7 7-7" />
      </svg>
    );

    const IconClose = ({ onClick }) => (
      <svg onClick={onClick} className="w-6 h-6 text-gray-400 hover:text-white cursor-pointer" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
      </svg>
    );

    const IconCheck = () => (
      <svg className="w-5 h-5 text-lime-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" />
      </svg>
    );

    const IconRefresh = () => (
      <svg className="w-5 h-5 text-gray-400 hover:text-lime-400 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
    );

    const IconCamera = () => (
      <svg className="w-10 h-10 text-lime-400" viewBox="0 0 24 24" fill="currentColor">
        <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z" />
      </svg>
    );

    // --- Official Brand Logo ---
    const BrandLogo = ({ size = 96, className = "" }) => (
      <div 
        style={{ width: size, height: size }}
        className={`relative flex items-center justify-center rounded-full bg-black shadow-lg shadow-lime-500/10 ${className}`}
      >
        <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-[0_0_15px_rgba(52,211,153,0.3)]">
          <defs>
            <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor="#bbf7d0" />
              <stop offset="25%" stopColor="#84cc16" />
              <stop offset="70%" stopColor="#10b981" />
              <stop offset="100%" stopColor="#06b6d4" />
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="44" fill="none" stroke="url(#brandGrad)" strokeWidth="8" />
          <path d="M36 28 L48 28 L38 42 Z" fill="url(#brandGrad)" />
          <path d="M54 28 L68 28 L34 74 L48 74 Z" fill="url(#brandGrad)" />
          <path d="M55 60 L65 74 L51 74 Z" fill="url(#brandGrad)" />
        </svg>
      </div>
    );

    // --- iOS 3D Wheel Picker Component ---
    const WheelPicker = ({ items, selectedValue, onSelect, itemHeight = 44 }) => {
      const scrollRef = useRef(null);
      const isUserScrolling = useRef(false);
      const scrollTimeout = useRef(null);

      const selectedIndex = Math.max(0, items.findIndex(item => (typeof item === 'object' ? item.value : item) === selectedValue));

      useEffect(() => {
        if (scrollRef.current && !isUserScrolling.current) {
          scrollRef.current.scrollTop = selectedIndex * itemHeight;
        }
      }, [selectedValue, items]);

      const handleScroll = (e) => {
        isUserScrolling.current = true;
        clearTimeout(scrollTimeout.current);
        const top = e.target.scrollTop;
        const newIndex = Math.round(top / itemHeight);
        
        scrollTimeout.current = setTimeout(() => {
          if (newIndex >= 0 && newIndex < items.length) {
            const val = typeof items[newIndex] === 'object' ? items[newIndex].value : items[newIndex];
            onSelect(val);
          }
          if (scrollRef.current) {
            scrollRef.current.scrollTo({ top: newIndex * itemHeight, behavior: 'smooth' });
          }
          isUserScrolling.current = false;
        }, 120);
      };

      return (
        <div className="relative h-56 w-full overflow-hidden select-none">
          {/* Top & Bottom gradient mask */}
          <div className="absolute top-0 inset-x-0 h-20 bg-gradient-to-b from-white via-white/80 to-transparent z-10 pointer-events-none" />
          <div className="absolute bottom-0 inset-x-0 h-20 bg-gradient-to-t from-white via-white/80 to-transparent z-10 pointer-events-none" />
          
          {/* Active selection bar */}
          <div 
            className="absolute top-1/2 left-4 right-4 -translate-y-1/2 rounded-xl bg-gray-100/90 pointer-events-none border border-gray-200"
            style={{ height: itemHeight }}
          />

          {/* Scroll List */}
          <div 
            ref={scrollRef}
            onScroll={handleScroll}
            className="h-full overflow-y-auto no-scrollbar scroll-smooth py-20"
            style={{ scrollSnapType: 'y mandatory' }}
          >
            {items.map((item, index) => {
              const val = typeof item === 'object' ? item.value : item;
              const label = typeof item === 'object' ? item.label : item;
              const isSelected = val === selectedValue;
              
              return (
                <div 
                  key={index}
                  onClick={() => {
                    onSelect(val);
                    if (scrollRef.current) {
                      scrollRef.current.scrollTo({ top: index * itemHeight, behavior: 'smooth' });
                    }
                  }}
                  style={{ height: itemHeight, scrollSnapAlign: 'center' }}
                  className={`flex items-center justify-center text-lg cursor-pointer transition-all duration-150 ${
                    isSelected ? 'text-black font-bold text-xl scale-105 z-20 relative' : 'text-gray-400 font-medium scale-95'
                  }`}
                >
                  {label}
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    // --- Main Application Component ---
    function App() {
      // Flow stages: 'LOGIN' | 'STEP1_USERNAME' | 'STEP2_PROFILE' | 'STEP_COUNTRY_STANDALONE' | 'STEP3_FITNESS' | 'HOME'
      const [stage, setStage] = useState('LOGIN');
      const [showSignUpSheet, setShowSignUpSheet] = useState(false);
      
      // Step 0: Verification Sheet
      const [email, setEmail] = useState('');
      const [code, setCode] = useState('');
      const [countdown, setCountdown] = useState(0);
      const [agreed, setAgreed] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      // Step 1: Username & Password
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);

      // Step 2: Profile (Avatar, Nickname, Country)
      const [avatar, setAvatar] = useState(null);
      const [nickname, setNickname] = useState('');
      const [suggestedNames, setSuggestedNames] = useState([]);
      const [selectedCountry, setSelectedCountry] = useState('Aland Islands');
      const [showCountryPicker, setShowCountryPicker] = useState(false);
      const [countrySearch, setCountrySearch] = useState('');

      // Step 3: Fitness Data State
      const [activeModal, setActiveModal] = useState(null); // 'GENDER' | 'DOB' | 'HEIGHT' | 'WEIGHT'
      const [heightUnit, setHeightUnit] = useState('cm'); // 'cm' | 'ft'
      const [weightUnit, setWeightUnit] = useState('lbs'); // 'kg' | 'lbs'
      
      const [gender, setGender] = useState('Male');
      const [dobMonth, setDobMonth] = useState('Oct');
      const [dobDay, setDobDay] = useState('08');
      const [dobYear, setDobYear] = useState('1999');

      const [heightCm, setHeightCm] = useState(180);
      const [heightFt, setHeightFt] = useState(5);
      const [heightIn, setHeightIn] = useState(11);

      const [weightKg, setWeightKg] = useState(80);
      const [weightLbs, setWeightLbs] = useState(180);

      // Final committed fitness data values
      const [fitnessData, setFitnessData] = useState({
        gender: '',
        dob: '',
        height: '',
        weight: ''
      });

      // Countries List
      const countries = [
        "Afghanistan", "Aland Islands", "Albania", "Algeria", "American Samoa",
        "Andorra", "Angola", "Anguilla", "Antarctica", "Antigua and Barbuda",
        "Argentina", "Armenia", "Aruba", "Australia", "Austria", "Azerbaijan",
        "Bahamas", "Bahrain", "Bangladesh", "Barbados", "Belarus", "Belgium",
        "Canada", "China", "France", "Germany", "Japan", "United Kingdom", "United States"
      ];

      // Countdown effect for verification code
      useEffect(() => {
        let timer;
        if (countdown > 0) {
          timer = setInterval(() => setCountdown(c => c - 1), 1000);
        }
        return () => clearInterval(timer);
      }, [countdown]);

      // Code sending handler
      const handleSendCode = () => {
        if (!email || !email.includes('@')) {
          setErrorMsg('Please enter a valid email address');
          return;
        }
        setErrorMsg('');
        setCountdown(59);
        setCode('212145'); // Pre-fill mock demo code
      };

      // Continue to Step 1 from Sign Up Bottom Sheet
      const handleVerifyContinue = () => {
        if (code !== '212145' && code !== '123456') {
          setErrorMsg('Invalid verification code. Use 212145');
          return;
        }
        setErrorMsg('');
        setShowSignUpSheet(false);
        setStage('STEP1_USERNAME');
      };

      // Third-party Login Handler
      const handleThirdPartyLogin = (provider) => {
        const generatedUser = (provider === 'Apple' ? 'AppleUser' : 'GoogleUser') + Math.floor(1000 + Math.random() * 9000);
        setUsername(generatedUser);
        setNickname(generatedUser);
        setShowSignUpSheet(false);
        setStage('STEP_COUNTRY_STANDALONE');
      };

      // Generate suggested names based on username
      const generateSuggestions = (base) => {
        const root = base || 'User';
        const num1 = Math.floor(100 + Math.random() * 900);
        const num2 = Math.floor(10000 + Math.random() * 90000);
        return [`${root}${num1}`, `${root}${num2}`];
      };

      // Validation for Username
      const validateUsername = (val) => {
        const clean = val.trim();
        if (clean.length < 3 || clean.length > 15) {
          return "Must be within 3-15 characters";
        }
        const letterCount = (clean.match(/[a-zA-Z]/g) || []).length;
        if (letterCount < 3) {
          return "Must contain at least 3 letters";
        }
        if (!/^[a-zA-Z0-9]+$/.test(clean)) {
          return "Only letters and numbers allowed";
        }
        return null;
      };

      // Handle Step 1 Next
      const handleStep1Next = () => {
        const vError = validateUsername(username);
        if (vError) {
          setErrorMsg(vError);
          return;
        }
        if (!password || password.length < 6) {
          setErrorMsg("Password must be at least 6 characters");
          return;
        }
        setErrorMsg('');
        const normalized = username.toLowerCase();
        setNickname(username);
        setSuggestedNames(generateSuggestions(username));
        setStage('STEP2_PROFILE');
      };

      return (
        <div className="w-full max-w-[420px] h-[880px] bg-black text-white relative rounded-[44px] overflow-hidden border-[8px] border-[#222] shadow-2xl flex flex-col font-sans">
          
          {/* iOS Status Bar */}
          <div className="flex justify-between items-center px-8 pt-4 pb-2 text-xs font-semibold select-none z-30">
            <span>9:41</span>
            <div className="w-24 h-4 bg-black rounded-full mx-auto" />
            <div className="flex items-center space-x-1.5">
              <span className="text-[10px]">5G</span>
              <div className="w-5 h-2.5 border border-white/80 rounded-sm p-0.5 flex items-center">
                <div className="w-full h-full bg-white rounded-2xs" />
              </div>
            </div>
          </div>

          {/* Toast Message */}
          {errorMsg && (
            <div className="absolute top-12 inset-x-6 z-50 bg-red-600/95 text-white py-2.5 px-4 rounded-xl text-center text-sm font-medium shadow-lg animate-bounce">
              {errorMsg}
            </div>
          )}

          {/* MAIN CONTAINER */}
          <div className="flex-1 flex flex-col relative overflow-hidden">

            {/* 1. LOGIN SCREEN */}
            {stage === 'LOGIN' && (
              <div className="flex-1 flex flex-col px-6 pt-6 pb-8 justify-between">
                <div className="flex justify-end">
                  <button 
                    onClick={() => setStage('HOME')} 
                    className="border border-lime-400 text-lime-400 px-3.5 py-1 rounded-md text-xs font-semibold hover:bg-lime-400 hover:text-black transition"
                  >
                    skip
                  </button>
                </div>

                <div className="flex flex-col items-center">
                  <BrandLogo size={110} />
                  
                  <div className="w-full space-y-4 mt-12">
                    <input 
                      type="text" 
                      placeholder="Enter email address" 
                      className="w-full h-12 bg-neutral-900/90 border border-neutral-800 rounded-full px-5 text-sm placeholder-gray-500 focus:outline-none focus:border-lime-400"
                    />
                    <div className="relative">
                      <input 
                        type="password" 
                        placeholder="Enter password" 
                        className="w-full h-12 bg-neutral-900/90 border border-neutral-800 rounded-full px-5 text-sm placeholder-gray-500 focus:outline-none focus:border-lime-400 pr-10"
                      />
                      <span className="absolute right-4 top-3.5 text-gray-400 cursor-pointer">👁</span>
                    </div>

                    <div className="flex justify-between items-center text-xs px-2 text-gray-400">
                      <button onClick={() => setShowSignUpSheet(true)} className="underline hover:text-white">
                        Sign Up
                      </button>
                      <button className="hover:text-white">Forgot Password?</button>
                    </div>

                    <button 
                      onClick={() => setStage('HOME')}
                      className="w-full h-12 bg-[#bbf705] hover:bg-lime-400 text-black font-bold rounded-full transition text-sm tracking-wide shadow-lg shadow-lime-500/20"
                    >
                      Log in
                    </button>

                    <div className="flex items-center space-x-2 text-xs text-gray-400 px-1 pt-1">
                      <input type="checkbox" className="rounded accent-lime-400 w-4 h-4 bg-transparent border-gray-600" />
                      <span>I agree to the <span className="underline text-gray-300">Terms of Service & Privacy Policy</span></span>
                    </div>
                  </div>
                </div>

                <div className="space-y-3">
                  <div className="flex items-center space-x-4 my-2">
                    <div className="flex-1 h-px bg-neutral-800" />
                    <span className="text-xs text-neutral-500">or</span>
                    <div className="flex-1 h-px bg-neutral-800" />
                  </div>

                  <button 
                    onClick={() => handleThirdPartyLogin('Apple')}
                    className="w-full h-12 border border-neutral-700 hover:border-neutral-500 rounded-full flex items-center justify-center space-x-2 text-sm font-medium transition"
                  >
                    <span></span>
                    <span>Continue with Apple</span>
                  </button>

                  <button 
                    onClick={() => handleThirdPartyLogin('Google')}
                    className="w-full h-12 border border-neutral-700 hover:border-neutral-500 rounded-full flex items-center justify-center space-x-2 text-sm font-medium transition"
                  >
                    <span className="font-bold text-red-400">G</span>
                    <span>Continue with Google</span>
                  </button>
                </div>
              </div>
            )}

            {/* SIGN UP BOTTOM SHEET */}
            {showSignUpSheet && (
              <div className="absolute inset-0 z-40 bg-black/70 backdrop-blur-xs flex flex-col justify-end">
                <div className="bg-white text-black rounded-t-[32px] px-6 pt-5 pb-8 space-y-5 animate-slide-up">
                  <div className="flex justify-between items-center">
                    <span className="text-base font-bold">Sign Up</span>
                    <IconClose onClick={() => setShowSignUpSheet(false)} />
                  </div>

                  <h2 className="text-xl font-bold tracking-tight">Create your On account</h2>

                  <div className="space-y-4">
                    <div className="relative border-b border-gray-300 pb-2">
                      <label className="text-xs text-gray-400 block mb-1">Email</label>
                      <input 
                        type="email"
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        placeholder="Lynn@Tekxyz.com"
                        className="w-full text-base font-medium text-black focus:outline-none"
                      />
                      {email.includes('@') && (
                        <div className="absolute right-0 bottom-2">
                          <IconCheck />
                        </div>
                      )}
                    </div>

                    <div className="relative border-b border-gray-300 pb-2">
                      <label className="text-xs text-gray-400 block mb-1">code</label>
                      <div className="flex justify-between items-center">
                        <input 
                          type="text"
                          value={code}
                          onChange={(e) => setCode(e.target.value)}
                          placeholder="6-digit code"
                          className="w-36 text-base font-semibold text-black focus:outline-none"
                        />
                        <button 
                          onClick={handleSendCode}
                          disabled={countdown > 0}
                          className="text-xs font-semibold text-lime-600 hover:text-lime-700 disabled:text-gray-400"
                        >
                          {countdown > 0 ? `Send Code (${countdown})` : 'Send Code'}
                        </button>
                      </div>
                    </div>

                    <div className="flex items-start space-x-2 text-xs text-gray-600 pt-1">
                      <input 
                        type="checkbox"
                        checked={agreed}
                        onChange={(e) => setAgreed(e.target.checked)}
                        className="mt-0.5 accent-black w-4 h-4 rounded"
                      />
                      <div>
                        <span className="font-bold text-black">Sign up for email updates from TekXYZ</span>
                        <p className="text-[11px] text-gray-400">I agree to the <span className="underline">Terms of Service & Privacy Policy</span></p>
                      </div>
                    </div>

                    <button 
                      onClick={handleVerifyContinue}
                      className={`w-full h-12 rounded-full font-bold text-sm transition mt-3 ${
                        code.length >= 4 ? 'bg-[#bbf705] text-black shadow-md' : 'bg-gray-300 text-gray-500'
                      }`}
                    >
                      Continue
                    </button>

                    <div className="pt-2 space-y-2.5">
                      <button 
                        onClick={() => handleThirdPartyLogin('Apple')}
                        className="w-full h-11 border border-gray-300 rounded-full flex items-center justify-center space-x-2 text-sm font-medium hover:bg-gray-50"
                      >
                        <span></span>
                        <span>Continue with Apple</span>
                      </button>
                      <button 
                        onClick={() => handleThirdPartyLogin('Google')}
                        className="w-full h-11 border border-gray-300 rounded-full flex items-center justify-center space-x-2 text-sm font-medium hover:bg-gray-50"
                      >
                        <span className="text-red-500 font-bold">G</span>
                        <span>Continue with Google</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* 2. STEP 1 - USERNAME & PASSWORD */}
            {stage === 'STEP1_USERNAME' && (
              <div className="flex-1 flex flex-col justify-between px-6 pt-2 pb-8">
                <div>
                  <div className="flex items-center justify-between py-2">
                    <div onClick={() => setStage('LOGIN')}>
                      <IconArrowLeft />
                    </div>
                    <span className="text-sm font-medium text-gray-300">Sign Up</span>
                    <div className="w-6" />
                  </div>

                  {/* Progress Indicator (Step 1/3) */}
                  <div className="w-full bg-neutral-800 h-1 rounded-full mt-2 mb-8 overflow-hidden">
                    <div className="bg-lime-400 h-full w-1/3 transition-all duration-300" />
                  </div>

                  <h1 className="text-2xl font-bold tracking-tight mb-6">Create a username</h1>

                  <div className="space-y-4">
                    <div>
                      <input 
                        type="text"
                        value={username}
                        onChange={(e) => {
                          setUsername(e.target.value);
                          setErrorMsg('');
                        }}
                        placeholder="username"
                        className="w-full h-13 bg-neutral-900 border border-neutral-800 rounded-xl px-4 text-white text-base focus:outline-none focus:border-lime-400"
                      />
                      <div className="text-[11px] text-gray-400 mt-2 space-y-0.5 px-1">
                        <p className={username.length >= 3 && username.length <= 15 ? "text-lime-400" : ""}>• Must be within 3-15 characters</p>
                        <p className={(username.match(/[a-zA-Z]/g) || []).length >= 3 ? "text-lime-400" : ""}>• Must contain at least 3 letters</p>
                        <p className={/^[a-zA-Z0-9]*$/.test(username) && username !== '' ? "text-lime-400" : ""}>• Only lowercase letters and numbers allowed</p>
                      </div>
                    </div>

                    <div className="relative">
                      <input 
                        type={showPassword ? "text" : "password"}
                        value={password}
                        onChange={(e) => setPassword(e.target.value)}
                        placeholder="Password (6-20 characters)"
                        className="w-full h-13 bg-neutral-900 border border-neutral-800 rounded-xl px-4 text-white text-base focus:outline-none focus:border-lime-400 pr-12"
                      />
                      <span 
                        onClick={() => setShowPassword(!showPassword)}
                        className="absolute right-4 top-4 text-gray-400 cursor-pointer text-sm"
                      >
                        {showPassword ? "🙈" : "👁"}
                      </span>
                    </div>
                  </div>
                </div>

                <button 
                  onClick={handleStep1Next}
                  className={`w-full h-12 rounded-full font-bold text-sm transition ${
                    username && password.length >= 6 ? 'bg-[#bbf705] text-black shadow-lg shadow-lime-500/20' : 'bg-neutral-800 text-gray-500'
                  }`}
                >
                  Next
                </button>
              </div>
            )}

            {/* 3. STEP 2 - PROFILE (Avatar, Nickname, Country) */}
            {stage === 'STEP2_PROFILE' && (
              <div className="flex-1 flex flex-col justify-between px-6 pt-2 pb-8">
                <div>
                  <div className="flex items-center justify-between py-2">
                    <div onClick={() => setStage('STEP1_USERNAME')}>
                      <IconArrowLeft />
                    </div>
                    <span className="text-sm font-medium text-gray-300">Sign Up</span>
                    <div className="w-6" />
                  </div>

                  {/* Progress Indicator (Step 2/3) */}
                  <div className="w-full bg-neutral-800 h-1 rounded-full mt-2 mb-6 overflow-hidden">
                    <div className="bg-lime-400 h-full w-2/3 transition-all duration-300" />
                  </div>

                  {/* Circular Avatar */}
                  <div className="flex justify-center my-4">
                    <div 
                      onClick={() => {
                        const samplePhotos = [
                          'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&h=200&fit=crop&crop=face',
                          'https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=200&h=200&fit=crop&crop=face'
                        ];
                        setAvatar(samplePhotos[Math.floor(Math.random() * samplePhotos.length)]);
                      }}
                      className="w-28 h-28 rounded-full border-2 border-lime-400 bg-neutral-900 flex items-center justify-center overflow-hidden cursor-pointer hover:opacity-90 relative shadow-lg shadow-lime-500/10"
                    >
                      {avatar ? (
                        <img src={avatar} alt="Avatar" className="w-full h-full object-cover" />
                      ) : (
                        <IconCamera />
                      )}
                    </div>
                  </div>

                  <h1 className="text-2xl font-bold tracking-tight text-center mb-6">What's your name?</h1>

                  <div className="space-y-4">
                    <input 
                      type="text"
                      value={nickname}
                      onChange={(e) => setNickname(e.target.value)}
                      placeholder="Your name"
                      className="w-full h-12 bg-neutral-900 border border-neutral-800 rounded-xl px-4 text-white text-base focus:outline-none focus:border-lime-400"
                    />

                    {/* Recommendation Pills & Refresh */}
                    <div className="flex items-center space-x-2">
                      {suggestedNames.map((sug, i) => (
                        <button 
                          key={i}
                          onClick={() => setNickname(sug)}
                          className="flex-1 py-1.5 px-3 bg-neutral-800/90 hover:bg-neutral-700 text-xs font-semibold rounded-full border border-neutral-700 text-gray-200 truncate transition"
                        >
                          {sug}
                        </button>
                      ))}
                      <button 
                        onClick={() => setSuggestedNames(generateSuggestions(username))}
                        className="p-2 bg-neutral-800 hover:bg-neutral-700 rounded-full border border-neutral-700"
                        title="Regenerate suggestions"
                      >
                        <IconRefresh />
                      </button>
                    </div>

                    {/* Country Selector Card */}
                    <div 
                      onClick={() => setShowCountryPicker(true)}
                      className="w-full h-12 bg-neutral-900 border border-neutral-800 rounded-xl px-4 flex justify-between items-center cursor-pointer hover:border-neutral-700 mt-4"
                    >
                      <span className="text-sm text-gray-400">Country/Region</span>
                      <div className="flex items-center space-x-2">
                        <span className="text-sm font-semibold text-white">{selectedCountry}</span>
                        <span className="text-gray-500 text-xs">&gt;</span>
                      </div>
                    </div>
                  </div>
                </div>

                <button 
                  onClick={() => {
                    if (!selectedCountry) {
                      setErrorMsg("Please select your country/region");
                      return;
                    }
                    setErrorMsg('');
                    setStage('STEP3_FITNESS');
                  }}
                  className="w-full h-12 bg-[#bbf705] hover:bg-lime-400 text-black font-bold rounded-full text-sm transition shadow-lg shadow-lime-500/20"
                >
                  Next
                </button>
              </div>
            )}

            {/* 4. THIRD-PARTY STANDALONE COUNTRY SCREEN */}
            {stage === 'STEP_COUNTRY_STANDALONE' && (
              <div className="flex-1 flex flex-col justify-between px-6 pt-2 pb-8">
                <div>
                  <div className="flex items-center justify-between py-2">
                    <div onClick={() => setStage('LOGIN')}>
                      <IconArrowLeft />
                    </div>
                    <span className="text-sm font-medium text-gray-300">Sign Up</span>
                    <div className="w-6" />
                  </div>

                  <div className="w-full bg-neutral-800 h-1 rounded-full mt-2 mb-8 overflow-hidden">
                    <div className="bg-lime-400 h-full w-1/2" />
                  </div>

                  <h1 className="text-2xl font-bold tracking-tight mb-8">Please select your country/region.</h1>

                  <div 
                    onClick={() => setShowCountryPicker(true)}
                    className="w-full h-13 bg-neutral-900 border border-neutral-800 rounded-xl px-4 flex justify-between items-center cursor-pointer hover:border-neutral-700"
                  >
                    <span className="text-sm text-gray-400">Country/Region</span>
                    <div className="flex items-center space-x-2">
                      <span className="text-sm font-semibold text-white">{selectedCountry}</span>
                      <span className="text-gray-500 text-xs">&gt;</span>
                    </div>
                  </div>
                </div>

                <button 
                  onClick={() => setStage('STEP3_FITNESS')}
                  className="w-full h-12 bg-[#bbf705] hover:bg-lime-400 text-black font-bold rounded-full text-sm transition shadow-lg shadow-lime-500/20"
                >
                  Next
                </button>
              </div>
            )}

            {/* 5. STEP 3 - FITNESS DATA SCREEN */}
            {stage === 'STEP3_FITNESS' && (
              <div className="flex-1 flex flex-col justify-between px-6 pt-2 pb-8">
                <div>
                  <div className="flex items-center justify-between py-2">
                    <div onClick={() => setStage('STEP2_PROFILE')}>
                      <IconArrowLeft />
                    </div>
                    <span className="text-sm font-medium text-gray-300">Sign Up</span>
                    <div className="w-6" />
                  </div>

                  <div className="w-full bg-neutral-800 h-1 rounded-full mt-2 mb-6 overflow-hidden">
                    <div className="bg-lime-400 h-full w-full" />
                  </div>

                  <h1 className="text-2xl font-bold tracking-tight mb-2">Let us help you track and manage your fitness data!</h1>
                  <p className="text-xs text-lime-400/90 mb-6 font-medium">This data directly calibrates your boxing workout and caloric accuracy.</p>

                  <div className="space-y-3">
                    {/* Gender Row */}
                    <div 
                      onClick={() => setActiveModal('GENDER')}
                      className="w-full h-13 bg-neutral-900 border border-neutral-800 rounded-xl px-4 flex justify-between items-center cursor-pointer hover:border-neutral-700 transition"
                    >
                      <span className="text-sm text-gray-400">Gender</span>
                      <div className="flex items-center space-x-2">
                        <span className="text-sm font-bold text-white">{fitnessData.gender || gender}</span>
                        <span className="text-gray-500 text-xs">&gt;</span>
                      </div>
                    </div>

                    {/* Date of Birth Row */}
                    <div 
                      onClick={() => setActiveModal('DOB')}
                      className="w-full h-13 bg-neutral-900 border border-neutral-800 rounded-xl px-4 flex justify-between items-center cursor-pointer hover:border-neutral-700 transition"
                    >
                      <span className="text-sm text-gray-400">Date of Birth</span>
                      <div className="flex items-center space-x-2">
                        <span className="text-sm font-bold text-white">
                          {fitnessData.dob || `${dobMonth} ${dobDay}, ${dobYear}`}
                        </span>
                        <span className="text-gray-500 text-xs">&gt;</span>
                      </div>
                    </div>

                    {/* Height Row */}
                    <div 
                      onClick={() => setActiveModal('HEIGHT')}
                      className="w-full h-13 bg-neutral-900 border border-neutral-800 rounded-xl px-4 flex justify-between items-center cursor-pointer hover:border-neutral-700 transition"
                    >
                      <span className="text-sm text-gray-400">Height</span>
                      <div className="flex items-center space-x-2">
                        <span className="text-sm font-bold text-white">
                          {fitnessData.height || (heightUnit === 'cm' ? `${heightCm} cm` : `${heightFt} ft ${heightIn} in`)}
                        </span>
                        <span className="text-gray-500 text-xs">&gt;</span>
                      </div>
                    </div>

                    {/* Weight Row */}
                    <div 
                      onClick={() => setActiveModal('WEIGHT')}
                      className="w-full h-13 bg-neutral-900 border border-neutral-800 rounded-xl px-4 flex justify-between items-center cursor-pointer hover:border-neutral-700 transition"
                    >
                      <span className="text-sm text-gray-400">Weight</span>
                      <div className="flex items-center space-x-2">
                        <span className="text-sm font-bold text-white">
                          {fitnessData.weight || (weightUnit === 'lbs' ? `${weightLbs} lbs` : `${weightKg} kg`)}
                        </span>
                        <span className="text-gray-500 text-xs">&gt;</span>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="flex space-x-3 pt-4">
                  <button 
                    onClick={() => setStage('HOME')}
                    className="flex-1 h-12 rounded-full border border-neutral-700 hover:border-neutral-500 text-white font-semibold text-sm transition"
                  >
                    Skip
                  </button>
                  <button 
                    onClick={() => setStage('HOME')}
                    className="flex-1 h-12 rounded-full bg-[#bbf705] hover:bg-lime-400 text-black font-bold text-sm transition shadow-lg shadow-lime-500/20"
                  >
                    Sign Up
                  </button>
                </div>
              </div>
            )}

            {/* 6. HOME PAGE (TikTok/Reels Boxing Video Feed) */}
            {stage === 'HOME' && (
              <div className="flex-1 relative flex flex-col justify-between overflow-hidden bg-neutral-950">
                {/* Background Boxing Video Simulation */}
                <img 
                  src="https://images.unsplash.com/photo-1549719386-74dfcbf7dbed?w=800&auto=format&fit=crop&q=80"
                  alt="Boxing Workout"
                  className="absolute inset-0 w-full h-full object-cover opacity-60"
                />
                <div className="absolute inset-0 bg-gradient-to-b from-black/60 via-transparent to-black/90 pointer-events-none" />

                {/* Top Video Header */}
                <div className="relative z-10 px-5 pt-3">
                  <div className="bg-neutral-900/80 backdrop-blur-md rounded-2xl p-2.5 flex items-center justify-between border border-white/10 shadow-lg">
                    <span className="text-xs font-semibold text-gray-200 truncate max-w-[200px]">
                      The May '26 Speed King Challe...
                    </span>
                    <div className="flex items-center space-x-2">
                      <span className="flex items-center text-[10px] text-lime-400 bg-lime-400/10 px-2 py-0.5 rounded-full font-bold">
                        <span className="w-1.5 h-1.5 rounded-full bg-lime-400 mr-1 animate-pulse" />
                        Online 3
                      </span>
                      <button className="text-gray-300">📝</button>
                    </div>
                  </div>

                  <div className="flex justify-center mt-3">
                    <div className="bg-black/70 backdrop-blur-md px-4 py-1.5 rounded-full border border-white/15 flex items-center space-x-3 text-sm font-black tracking-wide">
                      <span className="text-red-500">🥊</span>
                      <span className="text-lime-400 font-mono">12</span>
                      <span className="text-gray-500">|</span>
                      <span className="font-mono text-white">10:00</span>
                    </div>
                  </div>
                </div>

                {/* Right Side Social Action Bar */}
                <div className="absolute right-4 bottom-24 z-10 flex flex-col items-center space-y-4">
                  <div className="relative">
                    <div className="w-11 h-11 rounded-full border-2 border-white overflow-hidden bg-neutral-800">
                      <img 
                        src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" 
                        alt="Author" 
                        className="w-full h-full object-cover" 
                      />
                    </div>
                    <div className="absolute -bottom-1 left-1/2 -translate-x-1/2 bg-red-600 rounded-full w-4 h-4 text-[9px] flex items-center justify-center font-bold text-white">
                      +
                    </div>
                  </div>

                  <div className="flex flex-col items-center">
                    <button className="w-10 h-10 rounded-full bg-black/40 backdrop-blur-sm flex items-center justify-center text-xl hover:scale-110 transition">
                      🤍
                    </button>
                    <span className="text-[10px] text-gray-300 mt-0.5">Like</span>
                  </div>

                  <div className="flex flex-col items-center">
                    <button className="w-10 h-10 rounded-full bg-black/40 backdrop-blur-sm flex items-center justify-center text-xl hover:scale-110 transition">
                      💬
                    </button>
                    <span className="text-[10px] text-gray-300 mt-0.5">Comment</span>
                  </div>

                  <div className="flex flex-col items-center">
                    <button className="w-10 h-10 rounded-full bg-black/40 backdrop-blur-sm flex items-center justify-center text-xl hover:scale-110 transition">
                      🔖
                    </button>
                    <span className="text-[10px] text-gray-300 mt-0.5">Save</span>
                  </div>

                  <div className="flex flex-col items-center">
                    <button className="w-10 h-10 rounded-full bg-black/40 backdrop-blur-sm flex items-center justify-center text-xl hover:scale-110 transition">
                      ↗️
                    </button>
                    <span className="text-[10px] text-gray-300 mt-0.5">Share</span>
                  </div>
                </div>

                {/* Bottom Video Metadata */}
                <div className="relative z-10 px-5 pb-3 space-y-2">
                  <div className="inline-flex items-center space-x-2 bg-gradient-to-r from-lime-400 to-emerald-400 text-black px-3 py-1 rounded-full text-xs font-bold shadow-md">
                    <span>⏱ 5 SEC MAX</span>
                    <span>WEEK #123 &gt;</span>
                  </div>

                  <h3 className="font-bold text-base text-white">@{nickname || 'RyanG'}</h3>
                  <p className="text-xs text-lime-400 flex items-center font-semibold">
                    <span className="w-1.5 h-1.5 rounded-full bg-lime-400 inline-block mr-1.5" />
                    26 hits in 10 seconds
                  </p>
                  <p className="text-xs text-gray-300 line-clamp-2">
                    Your team is global. Your workouts should be too. May '26 Boxing Champion round!
                  </p>
                </div>

                {/* Bottom App Navigation Bar */}
                <div className="relative z-10 bg-black/90 backdrop-blur-md border-t border-neutral-900 px-6 py-2.5 flex justify-between items-center text-xs text-gray-500">
                  <div className="flex flex-col items-center text-white cursor-pointer">
                    <span className="text-lg">🏠</span>
                  </div>
                  <div className="flex flex-col items-center hover:text-white cursor-pointer">
                    <span className="text-lg">📊</span>
                  </div>
                  <div className="w-10 h-10 rounded-full bg-neutral-800 border border-neutral-700 flex items-center justify-center text-[10px] font-bold text-white hover:border-lime-400 cursor-pointer">
                    PLAY
                  </div>
                  <div className="flex flex-col items-center hover:text-white cursor-pointer relative">
                    <span className="text-lg">💬</span>
                    <span className="absolute -top-1 -right-2 bg-red-600 text-white text-[9px] rounded-full px-1 font-bold">4</span>
                  </div>
                  <div 
                    onClick={() => setStage('LOGIN')}
                    className="flex flex-col items-center hover:text-white cursor-pointer"
                    title="Log Out to Start Over"
                  >
                    <span className="text-lg">👤</span>
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* 7. FULLSCREEN COUNTRY SEARCH SHEET */}
          {showCountryPicker && (
            <div className="absolute inset-0 z-50 bg-black/70 backdrop-blur-xs flex flex-col justify-end">
              <div className="bg-white text-black rounded-t-[32px] pt-4 pb-6 flex flex-col h-[85%] animate-slide-up">
                <div className="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-3" />
                <div className="px-5 pb-3 flex items-center space-x-3">
                  <button onClick={() => setShowCountryPicker(false)} className="text-gray-400 text-lg">✕</button>
                  <div className="flex-1 bg-gray-100 rounded-full px-4 py-2 flex items-center space-x-2">
                    <span className="text-gray-400">🔍</span>
                    <input 
                      type="text"
                      placeholder="Search"
                      value={countrySearch}
                      onChange={(e) => setCountrySearch(e.target.value)}
                      className="bg-transparent text-sm w-full focus:outline-none text-black"
                    />
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto px-5 divide-y divide-gray-100">
                  {countries
                    .filter(c => c.toLowerCase().includes(countrySearch.toLowerCase()))
                    .map((item, i) => (
                      <div 
                        key={i}
                        onClick={() => {
                          setSelectedCountry(item);
                          setShowCountryPicker(false);
                        }}
                        className="py-3 flex justify-between items-center cursor-pointer hover:bg-gray-50"
                      >
                        <span className="text-sm font-medium">{item}</span>
                        <div className={`w-5 h-5 rounded-full border flex items-center justify-center ${
                          selectedCountry === item ? 'border-blue-500 bg-blue-500 text-white' : 'border-gray-300'
                        }`}>
                          {selectedCountry === item && <span className="text-xs">✓</span>}
                        </div>
                      </div>
                    ))}
                </div>
              </div>
            </div>
          )}

          {/* 8. FITNESS DATA WHEEL PICKER MODALS */}
          {activeModal && (
            <div className="absolute inset-0 z-50 bg-black/70 backdrop-blur-xs flex flex-col justify-end">
              <div className="bg-white text-black rounded-t-[32px] px-6 pt-5 pb-8 space-y-4 animate-slide-up">
                
                {/* Header */}
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-bold">
                    {activeModal === 'GENDER' && 'Select your gender'}
                    {activeModal === 'DOB' && 'Date of Birth'}
                    {activeModal === 'HEIGHT' && 'Select your height'}
                    {activeModal === 'WEIGHT' && 'Select your weight'}
                  </h3>
                  <button 
                    onClick={() => setActiveModal(null)}
                    className="text-sm font-semibold text-blue-600 hover:text-blue-800"
                  >
                    Skip
                  </button>
                </div>

                <p className="text-xs text-gray-500">
                  This helps us personalize your fitness targets. Your data stays private and secure.
                </p>

                {/* --- A. HEIGHT MODAL --- */}
                {activeModal === 'HEIGHT' && (
                  <div>
                    {/* Unit Switcher */}
                    <div className="flex bg-gray-100 p-1 rounded-xl mb-4">
                      <button 
                        onClick={() => setHeightUnit('cm')}
                        className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition ${
                          heightUnit === 'cm' ? 'bg-white shadow text-black' : 'text-gray-500'
                        }`}
                      >
                        cm
                      </button>
                      <button 
                        onClick={() => setHeightUnit('ft')}
                        className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition ${
                          heightUnit === 'ft' ? 'bg-white shadow text-black' : 'text-gray-500'
                        }`}
                      >
                        ft / in
                      </button>
                    </div>

                    {heightUnit === 'cm' ? (
                      <WheelPicker 
                        items={Array.from({ length: 91 }, (_, i) => `${130 + i} cm`)}
                        selectedValue={`${heightCm} cm`}
                        onSelect={(val) => setHeightCm(parseInt(val))}
                      />
                    ) : (
                      <div className="flex space-x-2">
                        <div className="flex-1">
                          <WheelPicker 
                            items={[4, 5, 6, 7].map(f => `${f} ft`)}
                            selectedValue={`${heightFt} ft`}
                            onSelect={(val) => setHeightFt(parseInt(val))}
                          />
                        </div>
                        <div className="flex-1">
                          <WheelPicker 
                            items={Array.from({ length: 12 }, (_, i) => `${i} in`)}
                            selectedValue={`${heightIn} in`}
                            onSelect={(val) => setHeightIn(parseInt(val))}
                          />
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* --- B. WEIGHT MODAL --- */}
                {activeModal === 'WEIGHT' && (
                  <div>
                    {/* Unit Switcher */}
                    <div className="flex bg-gray-100 p-1 rounded-xl mb-4">
                      <button 
                        onClick={() => setWeightUnit('kg')}
                        className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition ${
                          weightUnit === 'kg' ? 'bg-white shadow text-black' : 'text-gray-500'
                        }`}
                      >
                        kg
                      </button>
                      <button 
                        onClick={() => setWeightUnit('lbs')}
                        className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition ${
                          weightUnit === 'lbs' ? 'bg-white shadow text-black' : 'text-gray-500'
                        }`}
                      >
                        lbs
                      </button>
                    </div>

                    {weightUnit === 'lbs' ? (
                      <WheelPicker 
                        items={Array.from({ length: 280 }, (_, i) => `${80 + i} lbs`)}
                        selectedValue={`${weightLbs} lbs`}
                        onSelect={(val) => setWeightLbs(parseInt(val))}
                      />
                    ) : (
                      <WheelPicker 
                        items={Array.from({ length: 130 }, (_, i) => `${35 + i} kg`)}
                        selectedValue={`${weightKg} kg`}
                        onSelect={(val) => setWeightKg(parseInt(val))}
                      />
                    )}
                  </div>
                )}

                {/* --- C. DOB MODAL --- */}
                {activeModal === 'DOB' && (
                  <div className="flex space-x-1">
                    <div className="flex-1">
                      <WheelPicker 
                        items={['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']}
                        selectedValue={dobMonth}
                        onSelect={(val) => setDobMonth(val)}
                      />
                    </div>
                    <div className="flex-1">
                      <WheelPicker 
                        items={Array.from({ length: 31 }, (_, i) => (i + 1 < 10 ? `0${i + 1}` : `${i + 1}`))}
                        selectedValue={dobDay}
                        onSelect={(val) => setDobDay(val)}
                      />
                    </div>
                    <div className="flex-1">
                      <WheelPicker 
                        items={Array.from({ length: 80 }, (_, i) => `${1950 + i}`)}
                        selectedValue={dobYear}
                        onSelect={(val) => setDobYear(val)}
                      />
                    </div>
                  </div>
                )}

                {/* --- D. GENDER MODAL --- */}
                {activeModal === 'GENDER' && (
                  <WheelPicker 
                    items={['Male', 'Female', 'Others']}
                    selectedValue={gender}
                    onSelect={(val) => setGender(val)}
                  />
                )}

                {/* Confirm Select Button */}
                <button 
                  onClick={() => {
                    if (activeModal === 'HEIGHT') {
                      setFitnessData(prev => ({
                        ...prev,
                        height: heightUnit === 'cm' ? `${heightCm} cm` : `${heightFt} ft ${heightIn} in`
                      }));
                    } else if (activeModal === 'WEIGHT') {
                      setFitnessData(prev => ({
                        ...prev,
                        weight: weightUnit === 'lbs' ? `${weightLbs} lbs` : `${weightKg} kg`
                      }));
                    } else if (activeModal === 'DOB') {
                      setFitnessData(prev => ({
                        ...prev,
                        dob: `${dobMonth} ${dobDay}, ${dobYear}`
                      }));
                    } else if (activeModal === 'GENDER') {
                      setFitnessData(prev => ({
                        ...prev,
                        gender: gender
                      }));
                    }
                    setActiveModal(null);
                  }}
                  className="w-full h-12 bg-neutral-900 hover:bg-black text-white font-bold rounded-2xl transition shadow-md"
                >
                  Select
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
